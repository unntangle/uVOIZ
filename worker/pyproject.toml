[project]
name = "uvoiz-worker"
version = "0.1.0"
description = "uVOIZ live voice agent worker — runs on LiveKit Cloud"
requires-python = ">=3.10"

# Pinned to known-working versions as of writing. Bump in
# coordination with the LiveKit Agents framework's release notes —
# breaking changes happen often during this stage of the framework.
#
# When upgrading:
#   1. Read the changelog at github.com/livekit/agents/releases
#   2. Test in `python agent.py console` mode locally first
#   3. Test in dev mode with the Agents Playground
#   4. Only then deploy to LiveKit Cloud
dependencies = [
    "livekit-agents[openai]>=1.5.0,<2.0.0",
    "livekit-plugins-sarvam>=1.5.0,<2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# `dev` group has tooling we want available for local testing but
# don't ship into the production deploy on LiveKit Cloud.
dev = [
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Single-file worker — point hatch at it explicitly so we don't need
# a src/ layout.
packages = ["."]
include = ["agent.py"]

[tool.ruff]
# Match the rest of the codebase's loose-but-consistent style.
line-length = 100
target-version = "py310"
